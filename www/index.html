<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#14172b">
<title>Raddykall Puzzle Deluxe v34 · Edición sin Reino de Gemas</title>

































































  <link rel="stylesheet" href="./ui.css">
  <link rel="stylesheet" href="./ui-quality.css">
</head>
<body>
<div id="bg"><i></i><i></i><i></i><i></i><i class="hb"></i><i class="hb"></i><i class="sp" style="left:44%;top:22%;animation-delay:-1.6s;animation-duration:2.7s"></i><i class="sp" style="left:71%;top:15%;animation-delay:-1.5s;animation-duration:2.7s"></i><i class="sp" style="left:67%;top:30%;animation-delay:-0.1s;animation-duration:3.6s"></i><i class="sp" style="left:11%;top:33%;animation-delay:-0.4s;animation-duration:3.6s"></i><i class="sp" style="left:75%;top:18%;animation-delay:-3.8s;animation-duration:4.1s"></i><i class="sp" style="left:77%;top:10%;animation-delay:-2.3s;animation-duration:3.6s"></i><i class="sp" style="left:31%;top:8%;animation-delay:-2.2s;animation-duration:2.9s"></i><i class="sp" style="left:56%;top:21%;animation-delay:-2.2s;animation-duration:4.0s"></i><i class="sp" style="left:74%;top:90%;animation-delay:-0.7s;animation-duration:4.0s"></i><i class="sp" style="left:84%;top:27%;animation-delay:-1.5s;animation-duration:3.9s"></i><i class="sp" style="left:11%;top:75%;animation-delay:-0.2s;animation-duration:3.1s"></i><i class="sp" style="left:90%;top:71%;animation-delay:-1.7s;animation-duration:3.4s"></i><i class="sp" style="left:77%;top:61%;animation-delay:-1.4s;animation-duration:3.2s"></i><i class="sp" style="left:26%;top:92%;animation-delay:-3.1s;animation-duration:2.8s"></i></div>
<div id="app">
  <div id="hud">
    <div><div id="score">0</div><div id="best">Mejor: 0</div></div>
    <div id="lvl"><span id="lvlTxt">Nivel 1</span><i><b id="lvlBar"></b></i></div>
    <div><button class="ib" id="menuBtn" aria-label="Menú">☰</button><button class="ib hidden" id="gear" aria-label="Ajustes">⚙</button></div>
  </div>
  <div id="time" class="hidden"><i><b id="timeBar"></b></i><span id="timeTxt"></span></div>
  <div id="goal" class="hidden"><div class="gt"><span id="goalTxt"></span><b id="movesTxt"></b></div><i><b id="goalBar"></b></i></div>
  <button id="mchip" class="mchip hidden" aria-label="Misión activa"></button>
  <div id="stage"><canvas id="cv" tabindex="0" role="application" aria-label="Tablero de bloques. Arrastra una pieza de la bandeja y suéltala en la cuadrícula."></canvas>
    <div id="combo" class="combo hidden">
      <svg class="flame" viewBox="0 0 24 32" aria-hidden="true">
        <defs><linearGradient id="fg" x1="0" y1="1" x2="0" y2="0">
          <stop offset="0" style="stop-color:var(--f3)"/><stop offset=".55" style="stop-color:var(--f2)"/><stop offset="1" style="stop-color:var(--f1)"/>
        </linearGradient></defs>
        <path fill="url(#fg)" d="M12 1C12.6 6.2 19.5 10.2 19.5 19.2C19.5 26.4 16.2 31 12 31C7.8 31 4.5 26.4 4.5 19.2C4.5 15.4 6.6 12.8 8 10.2C8.7 12.4 9.7 13.6 10.9 14.2C10.4 9.6 10.6 5 12 1Z"/>
        <path style="fill:var(--f1)" opacity=".9" d="M12 15.5C12.8 18.4 16 20.4 16 24.2C16 27.4 14.2 29.2 12 29.2C9.8 29.2 8 27.4 8 24.2C8 21.6 10.4 19.6 12 15.5Z"/>
      </svg>
      <span>Racha</span><b id="comboN">×2</b>
    </div>
  </div>
  <div id="tools"></div>
  <div id="banner" class="hidden" aria-hidden="true"></div>
</div>
<div id="home" class="hidden"></div>
<div id="tetris" class="hidden">
  <div class="thud">
    <div class="tstat main"><b id="tScore">0</b><small id="tBest">Récord 0</small></div>
    <div class="tstat"><small>Nivel</small><b id="tLevel">1</b></div>
    <div class="tstat"><small>Líneas</small><b id="tLines">0</b></div>
    <div class="tbt"><button class="ib hidden" id="tGear" aria-label="Ajustes">⚙</button><button class="ib" id="tPause" aria-label="Pausa"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14M16 5v14"/></svg></button></div>
  </div>
  <div id="tstage"><canvas id="tcv"></canvas></div>
  <div id="tpad">
    <button class="tb" id="tL" aria-label="Izquierda"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
    <button class="tb" id="tR" aria-label="Derecha"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
    <button class="tb" id="tD" aria-label="Bajar"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 9l7 7 7-7"/></svg></button>
    <button class="tb" id="tHd" aria-label="Caída instantánea"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4l7 7 7-7M5 12l7 7 7-7"/></svg></button>
    <button class="tb big" id="tRot" aria-label="Girar"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 11-2.4-5.7M20 4v5h-5"/></svg></button>
    <button class="tb" id="tHold" aria-label="Guardar pieza"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7h12l-3-3M17 17H5l3 3"/></svg></button>
  </div>
  <div id="tbanner" class="hidden" aria-hidden="true"></div>
</div>
<div id="ov" class="ov hidden"></div>
<div id="quick" class="hidden"></div>
<div id="tut" class="ov hidden"></div>
<div id="shop" class="hidden"></div>
<div id="page" class="hidden"></div>

<div id="toast" class="hidden"></div>
<div id="splash"><img id="splashLogo" alt=""><div class="sp-bar"><i></i></div></div>
<div id="panel" class="hidden">
  <div class="sheet-head"><b>Ajustes del juego</b><button id="pClose" aria-label="Cerrar">✕</button></div>
  <div id="pBody"></div>
  <button class="btn" id="pRestart">Reiniciar partida</button>
  <button class="btn ghost" id="pCoins">+500 monedas (prueba)</button>
  <button class="btn ghost" id="pMis">Reiniciar misiones</button>
  <button class="btn ghost" id="pDevOff">Ocultar modo desarrollador</button>
</div>

<script src="./game.js"></script>



<script src="./language.js"></script>

  <script type="module" src="./admob.js"></script>
</body>
</html>
