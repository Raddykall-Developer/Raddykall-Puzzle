name: Crear APK Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar recursos del paquete gráfico
        shell: bash
        run: |
          set -euo pipefail
          base="public/assets/themes/block-puzzle-kit-free/art"
          for color in blue cyan green orange pink purple red yellow; do
            test -s "$base/glossy/hd/$color.png" || { echo "Falta recurso: $color.png"; exit 1; }
          done
          for asset in board/cell.png board/cell_alt.png board/frame.png; do
            test -s "$base/glossy/hd/$asset" || { echo "Falta recurso: $asset"; exit 1; }
          done
          for particle in glow ring shard sparkle; do
            test -s "$base/particles/$particle.png" || { echo "Falta partícula: $particle.png"; exit 1; }
          done
          grep -q "Block Puzzle Kit Free by heyheythere" public/assets/themes/block-puzzle-kit-free/LICENSE.txt
          test -s public/assets/branding/raddykall-launcher-source.jpg || { echo "Falta el logo del icono de Android"; exit 1; }
          for particle in circle_02 smoke_03 flame_03 flare_01 spark_01 star_01 magic_01 trace_03; do
            test -s "public/assets/kenney-particles/$particle.png" || { echo "Falta sprite de partícula Kenney: $particle.png"; exit 1; }
          done
          for icon in PNG/64x64/coins/coin_gold.png PNG/64x64/icons/bomb.png PNG/128x128/icons/btn_play.png PNG/128x128/icons/btn_gift.png PNG/128x128/icons/btn_shop.png PNG/128x128/icons/btn_gear.png; do
            test -s "public/assets/casual-mobile-ui/$icon" || { echo "Falta icono casual: $icon"; exit 1; }
          done
          for skybox in band dark day galaxy nebula; do
            test -s "public/assets/kenney-skyboxes-space/mobile/skybox-space-$skybox.webp" || { echo "Falta skybox optimizado: $skybox.webp"; exit 1; }
          done
          grep -q "Skyboxes Space (1.0)" public/assets/kenney-skyboxes-space/License.txt
          echo "OK: sprites, iconos, partículas, skyboxes optimizados y licencias presentes"

      - name: Construir el juego web con anuncios de prueba
        env:
          VITE_ADMOB_TEST_ADS: 'true'
        run: npm run build

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cachear dependencias de Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Crear el proyecto Android
        run: npx cap add android

      - name: Preparar Python para generar iconos
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Pillow
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Generar iconos adaptativos del launcher
        run: python scripts/generate-android-launcher-icons.py

      - name: Sincronizar los archivos del juego
        run: npx cap sync android

      - name: Configurar ID de aplicación de AdMob
        run: node scripts/configure-admob-android.mjs

      - name: Compilar APK de prueba
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Publicar APK descargable
        uses: actions/upload-artifact@v4
        with:
          name: Raddykall-Puzzle-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
