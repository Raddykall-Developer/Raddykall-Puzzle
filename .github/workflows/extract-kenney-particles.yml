name: Extract Kenney Particle Pack
on:
  push:
    paths:
      - 'kenney_particle-pack.zip'
      - '.github/workflows/extract-kenney-particles.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract-particles:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract transparent particle sprites
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/kenney-particles www/assets/kenney-particles
          mkdir -p /tmp/kenney-particles www/assets/kenney-particles
          unzip -q kenney_particle-pack.zip -d /tmp/kenney-particles
          echo "Top-level archive files:"
          find /tmp/kenney-particles -maxdepth 2 -type f | sed -n '1,80p'
          # Prefer transparent PNGs; black-background variants would create dark rectangles in-game.
          find /tmp/kenney-particles -type f -path '*/PNG (Transparent)/*.png' -print0 > /tmp/transparent-pngs.list
          if [ ! -s /tmp/transparent-pngs.list ]; then
            echo "No PNG (Transparent) directory found; falling back to PNGs outside black-background folders."
            find /tmp/kenney-particles -type f -iname '*.png' ! -path '*/PNG (Black background)/*' -print0 > /tmp/transparent-pngs.list
          fi
          count=$(tr -cd '\0' < /tmp/transparent-pngs.list | wc -c)
          test "$count" -gt 0
          while IFS= read -r -d '' file; do
            cp "$file" "www/assets/kenney-particles/$(basename "$file")"
          done < /tmp/transparent-pngs.list
          # Preserve the pack's license and basic documentation, but not the original archive.
          find /tmp/kenney-particles -type f \( -iname 'license*' -o -iname 'readme*' -o -iname 'credits*' \) -print0 |
          while IFS= read -r -d '' file; do
            cp "$file" "www/assets/kenney-particles/$(basename "$file")"
          done
          echo "Extracted transparent PNG sprites: $count"
          find www/assets/kenney-particles -type f -iname '*.png' -print | sort > /tmp/extracted-sprites.list
          sed -n '1,100p' /tmp/extracted-sprites.list
      - name: Commit extracted particle assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+actions-bot@users.noreply.github.com"
          git add www/assets/kenney-particles
          if git diff --cached --quiet; then
            echo "No particle asset changes to commit."
          else
            git commit -m "Extract transparent Kenney particle sprites"
            git push
          fi
